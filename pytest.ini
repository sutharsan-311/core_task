[pytest]
# Several pytest11 plugins pulled in by this repo's dependencies are built
# against a different pytest version than what's actually installed
# (varies by environment - pip pytest 9.x on the host, apt pytest elsewhere)
# and crash collection before any test file loads:
#   - launch_testing / launch_ros: ROS Humble, pre-8.0 pytest hookspecs.
#   - anyio: pulled in by anthropic/openai (httpx's async backend); its
#     pytest plugin expects a pytest internal (_pytest.scope.Scope) that
#     isn't present everywhere.
# None of this repo's tests use any of these frameworks - they're plain
# pytest against pure-Python modules - so disable all three rather than
# pin a global package.
addopts = -p no:launch_testing -p no:launch_ros -p no:anyio
